<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rng-vfx stand</title>
  <meta name="description" content="Live test stand for the rng-vfx agent skill: anime, toon, stylized, dark fantasy, pixel and realism effects with frame stepping, grayscale and engine render compare.">
  <link rel="stylesheet" href="./css/stand.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "lil-gui": "./vendor/lil-gui/lil-gui.esm.js"
    }
  }
  </script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="https://github.com/MRRengi/rng-vfx" target="_blank" rel="noopener">rng<span>-vfx</span></a>
    <nav class="tabs" id="styleTabs" aria-label="Style"></nav>
    <nav class="tabs small" id="fxTabs" aria-label="Effect"></nav>
    <nav class="tabs small mode" id="modeTabs" aria-label="Mode">
      <button data-mode="live" class="on">Live</button>
      <button data-mode="compare">Compare</button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <section class="view" id="view">
      <canvas id="c"></canvas>
      <div class="caption" id="caption"></div>
      <div class="hint" id="hint">Space play · ←/→ frame · R restart · G grayscale · 1-4 camera</div>
    </section>
    <aside class="compare" id="compare">
      <div class="compare-head">
        <strong>Engine renders</strong>
        <span id="compareInfo">Drop videos or frame strips here. They follow the timeline.</span>
      </div>
      <div class="slots" id="slots"></div>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="video/*,image/*" multiple hidden>
        <span>+ Drop or pick Unity / Unreal / three.js renders</span>
      </label>
    </aside>
  </main>

  <footer class="timeline">
    <button id="btnRestart" title="Restart (R)">⏮</button>
    <button id="btnBack" title="Frame back (←)">◀</button>
    <button id="btnPlay" title="Play / pause (Space)">❚❚</button>
    <button id="btnFwd" title="Frame forward (→)">▶</button>
    <input type="range" id="scrub" min="0" max="1" step="0.0001" value="0" aria-label="Timeline">
    <output id="time">0.000 s</output>
    <select id="speed" aria-label="Speed">
      <option value="1">1×</option>
      <option value="0.5">0.5×</option>
      <option value="0.25">0.25×</option>
      <option value="0.1">0.1×</option>
    </select>
    <label class="chk"><input type="checkbox" id="loop" checked> loop</label>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
